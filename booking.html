<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Booking | StayEasy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <a class="brand" href="index.html">StayEasy Hotel</a>
        <nav>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html">Book</a>
            <a href="register.html">Customer registration</a>
        </nav>
    </header>

    <main class="container narrow">
        <h1>Book your stay</h1>
        <p>Choose your dates and room details to review your booking.</p>

        <form id="booking-form">
            <label>Check-in date<input id="check-in" type="date" required></label>
            <label>Check-out date<input id="check-out" type="date" required></label>
            <label>Guest count<input id="guests" type="number" min="1" max="4" value="1" required></label>
            <label>Room type
                <select id="room-type" required>
                    <option value="">Choose room type</option>
                    <option value="standard">Standard room</option>
                    <option value="deluxe">Deluxe room</option>
                    <option value="family">Family room</option>
                </select>
            </label>

            <!-- Design Decision (Step 5): Added clear visual guidance next to the dependent dropdown. -->
            <!-- Why does this reduce user effort or confusion? It explains why the room number dropdown is initially disabled, preventing users from attempting to click an inactive field before choosing a room type. -->
            <small class="help-text" style="display:block; margin-bottom: 0.5rem; color: #555;">
                ℹ️ Select a room type above to see available room numbers.
            </small>

            <label>Room number
                <select id="room-number" required disabled>
                    <option value="">Choose room type first</option>
                </select>
            </label>
            <fieldset>
                <legend>Payment method</legend>
                <label class="inline"><input type="radio" name="payment" value="Card" checked>Card</label>
                <label class="inline"><input type="radio" name="payment" value="Bank transfer">Bank transfer</label>
            </fieldset>
            <label>Special request<textarea id="request" placeholder="Optional request"></textarea></label>
            <button type="submit">Review booking</button>
            <p id="status" class="status" role="status">Choose dates, room type, and room number.</p>
        </form>

        <section id="preview" class="preview" hidden></section>
    </main>

    <script src="js/rooms.js"></script>
    <script src="js/booking.js"></script>

    <!-- Usability test task: A guest wants to book a Deluxe room for 2 guests from Dec 10 to Dec 12, select an available room number, and choose Bank transfer payment. -->
    <!-- Expected evidence: I will watch for whether the guest notices that selecting 'Deluxe room' enables the 'Room number' dropdown, completes all required steps, and reviews the booking preview without asking for help. -->
</body>

</html>
